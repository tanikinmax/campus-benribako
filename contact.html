<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お問い合わせ | Campus便利箱</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: sans-serif;
  background: #f5f7fb;
  color: #333;
}

header {
  background: white;
  padding: 20px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

header h1 {
  margin: 0;
  color: #4361ee;
  font-size: 24px;
}

.container {
  max-width: 850px;
  margin: 35px auto;
  padding: 25px;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

h2 {
  text-align: center;
  margin-bottom: 15px;
}

.description {
  text-align: center;
  font-size: 14px;
  line-height: 1.8;
  color: #666;
  margin-bottom: 25px;
}

iframe {
  width: 100%;
  height: 1000px;
  border: none;
  border-radius: 10px;
}

.back {
  display: block;
  text-align: center;
  margin-top: 25px;
  color: #4361ee;
  text-decoration: none;
}

.back:hover {
  text-decoration: underline;
}

footer {
  text-align: center;
  padding: 25px;
  color: #888;
  font-size: 12px;
}

@media (max-width: 600px) {
  .container {
    padding: 15px;
  }

  .card {
    padding: 15px;
  }

  iframe {
    height: 1100px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Campus便利箱</h1>
</header>

<div class="container">

  <div class="card">

    <h2>お問い合わせ</h2>

    <p class="description">
      Campus便利箱をご利用いただきありがとうございます。<br>
      ご質問・ご意見・不具合の報告などはこちらからお送りください。
    </p>

    <iframe
      src="https://docs.google.com/forms/d/e/1FAIpQLSeKmlYTcy8N8PXmlFvqI_1B-KBVWu2SzgdASbsgHSJuB3tE_A/viewform?embedded=true">
      読み込んでいます…
    </iframe>

    <a class="back" href="index.html">
      ← トップページに戻る
    </a>

  </div>

</div>

<footer>
  © 2026 Campus便利箱
</footer>

</body>
</html>
